name: Refresh BTC watch

on:
  schedule:
    # Every 2 hours at :17 (odd minute avoids the top-of-hour queue on GitHub's cron)
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect, score, alert
        env:
          CRYPTOQUANT_API_KEY: ${{ secrets.CRYPTOQUANT_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python collect.py

      - name: Commit refreshed data
        run: |
          git config user.name "btc-watch bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data.json docs/alerts.json
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
