# Tunable thresholds. Percent values are plain numbers (5 = 5%).

alerts:
  cooldown_days: 5            # same alert type will not repeat inside this window

structural_add:               # long-dated call window
  sei_min: 55
  price_vs_200dma_max_pct: -8 # price at least this far below the 200-day average
  funding_max: 0.0            # average 3-day funding at or below this (per 8h, in %)
  fear_greed_max: 30
  etf_outflow_streak_min: 3

swing_entry:                  # 1-3 month tactical
  sei_min: 45
  rsi14_max: 32
  funding_max: 0.0
  fear_greed_max: 25

trim:                         # take profit / hedge
  rsi14_min: 76
  funding_min: 0.05
  fear_greed_min: 82
  price_vs_200dma_min_pct: 45

kill_switch:
  weeks_below_200wma: 2
  mvrv_max: 0.9

# Supply sink caption: new coins per day (falls to ~225 at the April 2028 halving)
issuance_btc_per_day: 450
